name: Build & Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.4.1）'
        required: false

env:
  MAIN_REPO: Coprexist/Copree

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Install NSIS
        shell: bash
        run: choco install nsis -y

      - name: Copy packaging files
        shell: bash
        run: |
          cp run_packaged.py source/
          cp server_core.py source/
          cp Copree.spec source/
          cp installer.nsi source/
          cp LICENSE.txt source/
          cp -r gui_app source/

      - name: PyInstaller (directory mode)
        working-directory: source
        run: pyinstaller Copree.spec

      - name: Launcher version
        shell: bash
        working-directory: source
        run: |
          VER="${{ steps.tag.outputs.tag }}"
          VER="${VER#v}"
          echo "!define VER3 \"$VER\"" > version.nsh
          echo "!define VER4 \"$VER.0\"" >> version.nsh
          echo "$VER" > version.txt

      - name: Build installer
        shell: bash
        working-directory: source
        run: |
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi || \
          "/c/Program Files/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES(x86)")/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES")/NSIS/makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-Installer
          path: source/Copree-Installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Copy packaging files
        shell: bash
        run: |
          cp run_packaged.py source/
          cp server_core.py source/
          cp -r gui_app source/
          mkdir -p source/frontend/public
          cp frontend/public/logo-transparent.* source/frontend/public/ 2>/dev/null || true

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name Copree \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Create dmg
        run: |
          hdiutil create -volname "Copree" -srcfolder source/dist/Copree.app -ov -format UDZO Copree.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-macOS
          path: Copree.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Copy packaging files
        shell: bash
        run: |
          cp run_packaged.py source/
          cp server_core.py source/
          cp -r gui_app source/

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name Copree \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Create tar.gz
        run: |
          cd source/dist && tar czf ../../Copree-Linux.tar.gz Copree/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-Linux
          path: Copree-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Copree-Installer
          path: artifacts

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: Copree-macOS
          path: artifacts

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: Copree-Linux
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Copree ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/Copree-Installer.exe
            artifacts/Copree.dmg
            artifacts/Copree-Linux.tar.gz

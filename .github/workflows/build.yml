name: Build & Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.4.1）'
        required: false
      build_only:
        description: '只构建、不上传 Release（验证打包链路用）'
        type: boolean
        default: false

env:
  MAIN_REPO: Coprexist/AIsChat

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install -r gui-requirements.txt

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Install NSIS
        shell: bash
        run: choco install nsis -y

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/stage.sh source

      - name: PyInstaller (directory mode)
        working-directory: source
        run: pyinstaller AIsChat.spec

      - name: Build installer
        shell: bash
        working-directory: source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 安装包里的版本号原先写死 0.3.14，比实际发布落后十个版本；按 tag 注入
          ver=${TAG#v}
          if [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i -E "s/VIProductVersion \"[0-9.]+\"/VIProductVersion \"${ver}.0\"/" installer.nsi
            sed -i -E "s/(VIAddVersionKey \"FileVersion\" \")[0-9.]+/\1${ver}/" installer.nsi
          else
            echo "tag ${TAG} 不是 x.y.z 形式，跳过版本号注入"
          fi
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi || \
          "/c/Program Files/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES(x86)")/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES")/NSIS/makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIsChat-Installer
          path: source/AIsChat-Installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install -r gui-requirements.txt

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/stage.sh source

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name AIsChat \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Create dmg
        run: |
          hdiutil create -volname "AIsChat" -srcfolder source/dist/AIsChat.app -ov -format UDZO AIsChat.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIsChat-macOS
          path: AIsChat.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/stage.sh source

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name AIsChat \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Create tar.gz
        run: |
          cd source/dist && tar czf ../../AIsChat-Linux.tar.gz AIsChat/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIsChat-Linux
          path: AIsChat-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    # workflow_dispatch 可用 build_only 只验证打包链路，不发布 Release
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: AIsChat-Installer
          path: artifacts

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: AIsChat-macOS
          path: artifacts

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: AIsChat-Linux
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AIsChat ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/AIsChat-Installer.exe
            artifacts/AIsChat.dmg
            artifacts/AIsChat-Linux.tar.gz

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v0.4.1）'
        required: false
      build_only:
        description: '只构建、不上传 Release（验证打包链路用）'
        type: boolean
        default: false

env:
  MAIN_REPO: Coprexist/Copree

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install -r gui-requirements.txt

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Install NSIS
        shell: bash
        run: choco install nsis -y

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 三个平台共用一份 staging 清单。Windows 原先自己留了一份 cp 列表，
          # 漏了 gui.py / api_prefix.py，打出来的 exe 一启动就 ModuleNotFoundError
          # （v0.4.16 的第一版安装包就是这么废的，体积也少了 16MB）。
          bash scripts/stage.sh source
          python scripts/check_api_prefix.py

      - name: Launcher version
        shell: bash
        working-directory: source
        run: |
          VER="${{ steps.tag.outputs.tag }}"
          VER="${VER#v}"
          echo "!define VER3 \"$VER\"" > version.nsh
          echo "!define VER4 \"$VER.0\"" >> version.nsh
          echo "$VER" > version.txt

      # 版本文件必须在 PyInstaller 之前落地，否则启动器页脚的版本号读不到
      - name: PyInstaller (directory mode)
        working-directory: source
        run: pyinstaller Copree.spec

      - name: Verify GUI bundle
        shell: bash
        working-directory: source
        run: |
          # gui.py 漏拷时 PyInstaller 只写 warning 不失败，装到用户机器上才炸。
          # customtkinter / PIL 是 GUI 链的探针：它们在 dist 里，说明 Analysis 真的分析到了 gui.py。
          set -euo pipefail
          for m in customtkinter PIL; do
            if ! find dist -maxdepth 4 -type d -name "$m" | grep -q .; then
              echo "dist 里没有 $m：GUI 依赖没被打进包，检查 staging 与 spec" >&2
              find dist -maxdepth 2 -type d >&2 || true
              exit 1
            fi
          done
          # 平台文档：read_manual 找 docs/guides/用户手册.md。spec 把 guides 放进 _MEIPASS，
          # 这里再往可执行文件旁放一份——安装包按 dist/Copree 整目录打包，文档随之落地。
          mkdir -p dist/Copree/docs
          cp -r docs/guides dist/Copree/docs/
          test -f dist/Copree/docs/guides/用户手册.md || { echo "文档没带上" >&2; exit 1; }
          echo "bundle ok: customtkinter + PIL 已打包，文档已带上"

      - name: Build installer
        shell: bash
        working-directory: source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 安装包里的版本号原先写死 0.3.14，比实际发布落后十个版本；按 tag 注入
          ver=${TAG#v}
          if [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i -E "s/VIProductVersion \"[0-9.]+\"/VIProductVersion \"${ver}.0\"/" installer.nsi
            sed -i -E "s/(VIAddVersionKey \"FileVersion\" \")[0-9.]+/\1${ver}/" installer.nsi
          else
            echo "tag ${TAG} 不是 x.y.z 形式，跳过版本号注入"
          fi
          "/c/Program Files (x86)/NSIS/makensis.exe" installer.nsi || \
          "/c/Program Files/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES(x86)")/NSIS/makensis.exe" installer.nsi || \
          "$(cygpath "$PROGRAMFILES")/NSIS/makensis.exe" installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-Installer
          path: source/Copree-Installer.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install -r gui-requirements.txt

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/stage.sh source
          # 打包版独有的 /api 前缀中间件守卫：带 query 的请求必须命中真实路由，
          # 不能掉进 SPA 兜底（见 api_prefix.py 的模块说明）
          python scripts/check_api_prefix.py

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name Copree \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --add-data "docs/guides:docs/guides" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Verify GUI bundle
        shell: bash
        working-directory: source
        run: |
          # gui.py 漏拷时 PyInstaller 只写 warning 不失败，装到用户机器上才炸。
          # customtkinter / PIL 是 GUI 链的探针：它们在 dist 里，说明 Analysis 真的分析到了 gui.py。
          set -euo pipefail
          for m in customtkinter PIL; do
            if ! find dist -maxdepth 4 -type d -name "$m" | grep -q .; then
              echo "dist 里没有 $m：GUI 依赖没被打进包，检查 staging 与 spec" >&2
              find dist -maxdepth 2 -type d >&2 || true
              exit 1
            fi
          done
          echo "bundle ok: customtkinter + PIL 已打包"

      - name: Create dmg
        run: |
          hdiutil create -volname "Copree" -srcfolder source/dist/Copree.app -ov -format UDZO Copree.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-macOS
          path: Copree.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ steps.tag.outputs.tag }}
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r source/backend/requirements.txt
          pip install customtkinter pystray pyinstaller

      - name: Build frontend
        shell: bash
        working-directory: source/frontend
        run: |
          npm ci
          npm run build

      - name: Stage packaging files
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bash scripts/stage.sh source
          # 打包版独有的 /api 前缀中间件守卫：带 query 的请求必须命中真实路由，
          # 不能掉进 SPA 兜底（见 api_prefix.py 的模块说明）
          python scripts/check_api_prefix.py

      - name: PyInstaller (directory mode)
        working-directory: source
        run: |
          pyinstaller --noconfirm --windowed \
            --name Copree \
            --add-data "backend/app:app" \
            --add-data "frontend/dist:frontend/dist" \
            --add-data "gui_app:gui_app" \
            --add-data "docs/guides:docs/guides" \
            --hidden-import gui_app \
            --hidden-import customtkinter \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            run_packaged.py

      - name: Verify GUI bundle
        shell: bash
        working-directory: source
        run: |
          # gui.py 漏拷时 PyInstaller 只写 warning 不失败，装到用户机器上才炸。
          # customtkinter / PIL 是 GUI 链的探针：它们在 dist 里，说明 Analysis 真的分析到了 gui.py。
          set -euo pipefail
          for m in customtkinter PIL; do
            if ! find dist -maxdepth 4 -type d -name "$m" | grep -q .; then
              echo "dist 里没有 $m：GUI 依赖没被打进包，检查 staging 与 spec" >&2
              find dist -maxdepth 2 -type d >&2 || true
              exit 1
            fi
          done
          echo "bundle ok: customtkinter + PIL 已打包"

      - name: Create tar.gz
        run: |
          cd source/dist && tar czf ../../Copree-Linux.tar.gz Copree/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Copree-Linux
          path: Copree-Linux.tar.gz

  release:
    needs: [build-windows, build-macos, build-linux]
    # workflow_dispatch 可用 build_only 只验证打包链路，不发布 Release
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Copree-Installer
          path: artifacts

      - name: Download macOS dmg
        uses: actions/download-artifact@v4
        with:
          name: Copree-macOS
          path: artifacts

      - name: Download Linux tarball
        uses: actions/download-artifact@v4
        with:
          name: Copree-Linux
          path: artifacts

      - name: List files
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Copree ${{ steps.tag.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/Copree-Installer.exe
            artifacts/Copree.dmg
            artifacts/Copree-Linux.tar.gz
